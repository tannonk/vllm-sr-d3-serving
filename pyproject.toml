[project]
name = "d3-spark-serving"
version = "0.1.0"
description = "Throughput-tuned serving of vllm-sr Decision 3.0 (d3-flash) on aarch64 CUDA hosts such as the DGX Spark"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["results"]
